<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financeiro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#f5f7fb] font-sans p-6">
<div class="max-w-6xl mx-auto">
<h1 class="text-3xl font-bold mb-1">Financeiro</h1>
<p class="text-gray-500 mb-6">Seu controle com F maiúsculo 💜</p>

<div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
<div class="bg-white p-5 rounded-2xl shadow-sm border"><p class="text-sm text-gray-500"><i class="fa-solid fa-arrow-up text-emerald-500 mr-1"></i> Total Entradas</p><h2 class="text-2xl font-bold">R$ 1.995,97</h2></div>
<div class="bg-white p-5 rounded-2xl shadow-sm border"><p class="text-sm text-gray-500"><i class="fa-solid fa-arrow-down text-rose-500 mr-1"></i> Total Saídas</p><h2 class="text-2xl font-bold">R$ 1.227,77</h2></div>
<div class="bg-indigo-600 text-white p-5 rounded-2xl shadow"><p class="text-sm opacity-80">Saldo Acumulado</p><h2 class="text-2xl font-bold">R$ 768,20</h2></div>
<div class="bg-white p-5 rounded-2xl shadow-sm border"><p class="text-sm text-gray-500">Taxa Economia</p><h2 class="text-2xl font-bold text-emerald-600">38,49%</h2><p class="text-xs text-gray-400">Média gastos R$ 409,26</p></div>
</div>

<div class="bg-white p-6 rounded-2xl shadow-sm border">
<h3 class="font-bold mb-4">Entradas x Saídas Mensais</h3>
<canvas id="grafico"></canvas>
</div>
</div>
<script>
new Chart(document.getElementById('grafico'),{
type:'bar',
data:{
labels:['Jan','Fev','Mar','Abr','Mai','Jun'],
datasets:[
{label:'Entradas',data:[320,410,280,350,335,300],backgroundColor:'#6366f1',borderRadius:8},
{label:'Saídas',data:[210,280,190,220,180,147],backgroundColor:'#f43f5e',borderRadius:8}
]
},
options:{plugins:{legend:{position:'bottom'}},scales:{y:{grid:{display:false}}}}
});
</script>
</body>
</html>
